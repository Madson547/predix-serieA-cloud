name: Coletor Diario - Predix Serie A

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 horario de Brasilia (UTC-3)
    - cron: '0 23 * * *'   # 20:00 horario de Brasilia
  workflow_dispatch:        # permite rodar manualmente pelo botao "Run workflow" no GitHub

jobs:
  rodar-coletor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Rodar coletor.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DADOS_FUTEBOL_KEY: ${{ secrets.DADOS_FUTEBOL_KEY }}
        run: |
          python coletor.py
